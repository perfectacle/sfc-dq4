name: Guard unit cache
description: >-
  One encrypted cache (enc-cache) per guard unit (a guard, or one part k/n of a guard with
  parts), holding the scene, start state and build stage caches the unit wrote under
  DQ4_UNIT_CACHE/<unit>. Keys are unit names, not shard numbers or modes, so a pull request
  run finds what the daily warm run (or any other shard count) left; entries inside are
  found by ROM bytes and code fingerprints, so a stale bundle only misses. The slot list is
  tools/guards.py --unit-slots; the slot count is guards.UNIT_SLOTS (test_release_gate_workflow
  checks both).
  Format: sfc/dq4/docs/dq4-release-check-format.md

inputs:
  op:
    description: restore or save
    required: true
  slots:
    description: JSON file from tools/guards.py --unit-slots ([{prefix, dir}])
    required: true
  age_key:
    description: age private key (secret CI_ROM_AGE_KEY)
    required: true

runs:
  using: composite
  steps:
    - name: Read the slots
      id: slots
      shell: bash
      env:
        SLOTS: ${{ inputs.slots }}
      run: uv run --frozen python tools/ci_cache.py slots --file "$SLOTS" --count 12 >> "$GITHUB_OUTPUT"

    - name: Unit slot 0
      if: steps.slots.outputs.p0 != ''
      uses: ./.github/actions/enc-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
      with:
        op: ${{ inputs.op }}
        name: unit-0
        prefix: ${{ steps.slots.outputs.p0 }}
        dir: ${{ steps.slots.outputs.d0 }}
        max_mb: '1500'
        age_key: ${{ inputs.age_key }}

    - name: Unit slot 1
      if: steps.slots.outputs.p1 != ''
      uses: ./.github/actions/enc-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
