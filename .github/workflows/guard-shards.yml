name: guard-shards

# Run-time guards split over runners, for callers only (workflow_call). It decrypts the
# ROM bundle with the secrets the caller passes, so every caller must keep secrets away
# from forks: release-gate.yml is manual only, and ci.yml's pr-guards job runs only for
# pull requests from branches of this repository. tools/tests/test_release_gate_workflow.py guards both
# files. Artifacts carry only verdict JSON, guard result records and logs, checked by
# tools/ci_artifact_check.py right before upload. Caches holding ROM-derived bytes go only
# through the encrypted composite actions enc-cache and ship-cache.
# Format: sfc/dq4/docs/dq4-release-check-format.md
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        type: string
        required: true
      mode:
        description: release (every guard) or pr (only the listed guards)
        type: string
        required: true
      guards:
        description: Comma-separated guard names (mode pr only)
        type: string
        default: ''
      shards:
        description: Number of guard shards (1-64)
        type: number
        default: 8
      sweeps:
        description: Also run the seed sweeps of every release.toml, one unit per seed (mode release only)
        type: boolean
        default: false
      cache:
        description: >-
          Use the build stage, scene and state caches and earlier passes (a rehearsal in mode
          release; the release gate itself runs with every cache off)
        type: boolean
        default: false
    secrets:
      CI_ROM_TOKEN:
        required: true
      CI_ROM_AGE_KEY:
        required: true

permissions:
  contents: read

env:
  # Guards whose needs name this stay on the local machine (results that differ on Linux).
  LOCAL_NEEDS: macos
  # Free plan: at most 20 jobs run at once for the account. A run is build, two rom jobs, the shards and report;
  # mode release adds the two cold-build jobs and build-verify, which run beside the shards (build and rom end
  # before them, report after; build-verify waits for cold-build, so at most two of them run at once). The shard
  # count is capped at JOB_LIMIT - FIXED_JOBS so the run never queues behind itself.
  JOB_LIMIT: 20
  FIXED_JOBS: 2

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Plan shards
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          MODE: ${{ inputs.mode }}
          GUARDS: ${{ inputs.guards }}
          SWEEPS: ${{ inputs.sweeps }}
        run: |
          case "$SHARDS" in ''|*[!0-9]*) echo "::error::shards must be a number"; exit 1 ;; esac
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 64 ]; then echo "::error::shards must be 1-64"; exit 1; fi
          most=$((JOB_LIMIT - FIXED_JOBS))
          if [ "$SHARDS" -gt "$most" ]; then
            echo "::notice::shards $SHARDS → $most (account job limit $JOB_LIMIT, $FIXED_JOBS other jobs in this run)"
            SHARDS=$most
          fi
          echo "count=$SHARDS" >> "$GITHUB_OUTPUT"
          case "$MODE" in
            release) [ -z "$GUARDS" ] || { echo "::error::mode release runs every guard; guards must be empty"; exit 1; } ;;
            pr) [ -n "$GUARDS" ] || { echo "::error::mode pr needs a guard list"; exit 1; } ;;
            *) echo "::error::mode must be release or pr"; exit 1 ;;
          esac
          if [ "$SWEEPS" = true ] && [ "$MODE" != release ]; then echo "::error::sweeps run only in mode release"; exit 1; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq -s, 1 "$SHARDS" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - name: List the shards
        env:
          SHARDS: ${{ steps.plan.outputs.count }}
          GUARDS: ${{ inputs.guards }}
          SWEEPS: ${{ inputs.sweeps }}
        run: |
          only=()
          if [ -n "$GUARDS" ]; then only=(--only "$GUARDS"); fi
          if [ "$SWEEPS" = true ]; then only+=(--sweeps); fi
          pids=()
          for k in $(seq 1 "$SHARDS"); do
            uv run --frozen python tools/guards.py --all "${only[@]}" --shard "$k/$SHARDS" --exclude-needs "$LOCAL_NEEDS" \
              >"$RUNNER_TEMP/shard-list-$k.txt" 2>&1 &
            pids+=("$!")
          done
          ok=0
          for pid in "${pids[@]}"; do wait "$pid" || ok=1; done
          for k in $(seq 1 "$SHARDS"); do cat "$RUNNER_TEMP/shard-list-$k.txt"; done
          exit "$ok"

  # The ship ROMs the guards build (dq4build.py --out work/ch1 and --out work/ch2 --chapter2),
  # each built once in parallel; shards copy them in place of every guard's own build.
  rom:
    name: ship ROM ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ch1
            args: ''
          - variant: ch2
            args: --chapter2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libsdl2-2.0-0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: perfectacle/sfc-dq4-assets
          token: ${{ secrets.CI_ROM_TOKEN }}
          path: assets
          persist-credentials: false

      # Guard input keys read big folders by size and mtime; a fresh checkout would change every key.
      - name: Pin the asset checkout's file times to its commit
        run: git -C assets ls-files -z | (cd assets && xargs -0 touch -h -d "@$(git log -1 --format=%ct)")

      - uses: ./.github/actions/ci-tools # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/

      - uses: ./.github/actions/ci-roms # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          token: ${{ secrets.CI_ROM_TOKEN }}
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      # The sound conversion cache is the asset repository's own (sfc/dq4/cache/sound), used by
      # the local release gate too; this keeps the files converted after its last commit.
      - name: Restore the sound conversion cache
        uses: ./.github/actions/enc-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: restore
          name: sound
          prefix: ship-sound-${{ matrix.variant }}
          dir: assets/sfc/dq4/cache/sound
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      # Build stage caches are on in every mode, the release gate too: the cold-build job rebuilds
      # both ROMs with every cache off in the same run and build-verify fails the run unless the bytes match.
      - name: Restore the ship ROM stage caches
        uses: ./.github/actions/ship-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: restore
          variant: ${{ matrix.variant }}
          calls: work/cache/calls
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      - name: Build the ship ROM
        env:
          DQ4_ASSETS: ${{ github.workspace }}/assets
          DQ4_READSET: 'off'
          DQ4_BUILD_CACHE: ${{ github.workspace }}/work/cache
          VARIANT: ${{ matrix.variant }}
          ARGS: ${{ matrix.args }}
        run: |
          args=()
          if [ -n "$ARGS" ]; then args=("$ARGS"); fi
          uv run --frozen python tools/ci_cache.py ship-build --out "work/$VARIANT" --chunks "$RUNNER_TEMP/ship-chunks" "${args[@]}"

      - name: Save the ship ROM stage caches
        uses: ./.github/actions/ship-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: save
          variant: ${{ matrix.variant }}
          calls: work/cache/calls
          chunks: ${{ runner.temp }}/ship-chunks
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      - name: Save the sound conversion cache
        uses: ./.github/actions/enc-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: save
          name: sound
          prefix: ship-sound-${{ matrix.variant }}
          dir: assets/sfc/dq4/cache/sound
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      # Built once per run; the shards take this copy (key bound to this run) instead of rebuilding. The key
      # leaves out run_attempt: "re-run failed jobs" reruns only the shards, which must still find it.
      - name: Hand the ship ROM to the shards
        uses: ./.github/actions/enc-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: save
          name: ship-rom-${{ matrix.variant }}
          prefix: ship-rom-${{ matrix.variant }}-${{ github.run_id }}
          dir: work/${{ matrix.variant }}
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      - name: Hash the cached build for build-verify
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p work/ci-digest
          uv run --frozen python tools/ci_cache.py digest --dir "work/$VARIANT" --variant "$VARIANT" --kind cached \
            --out "work/ci-digest/cached-$VARIANT.json"

      - name: Check the digest upload for ROM data
        id: digestcheck
        run: uv run --frozen python tools/ci_artifact_check.py work/ci-digest --hashes "$RUNNER_TEMP/rom-hashes.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.digestcheck.outcome == 'success' }}
        with:
          name: build-digest-${{ inputs.mode }}-cached-${{ matrix.variant }}
          path: work/ci-digest
          if-no-files-found: error
          retention-days: 14

  # Release gate only: both ship ROMs again from scratch with every cache off (build stages, sound
  # conversion and trace checks, uv packages, the tool builds) and ch2 on the Python path instead of the
  # Go tools, beside the shards. build-verify compares the bytes with the rom job's cached builds. One job
  # per variant: the Python sound compaction alone is the longest step of the whole gate.
  cold-build:
    name: cold build ${{ matrix.variant }}
    needs: build
    if: inputs.mode == 'release'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ch1
            args: ''
            native: ''
          - variant: ch2
            args: --chapter2
            native: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libsdl2-2.0-0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: false

      - run: uv sync --locked

      # Before the assets, tools and ROMs arrive, so this is the ROM-less CI test environment (CI_MIN).
      # Records only executed line numbers of build path files; the upload below carries them.
      - name: Measure build path coverage of the unit tests without ROMs
        if: matrix.variant == 'ch1'
        run: uv run --frozen python tools/release_check.py --ci-coverage unit work/ci-digest/coverage-unit.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: perfectacle/sfc-dq4-assets
          token: ${{ secrets.CI_ROM_TOKEN }}
          path: assets
          persist-credentials: false

      # The asset repository commits a sound conversion cache; drop it so nothing can read it.
      - name: Drop the committed sound conversion cache
        run: rm -rf assets/sfc/dq4/cache/sound

      - name: Build asar, fetch Galmuri, build libretro cores and the Go tools without caches
        run: tools/ci_gate_setup.sh tools

      - uses: ./.github/actions/ci-roms # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          token: ${{ secrets.CI_ROM_TOKEN }}
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      # ch2 runs on the Python path (DQ4_NATIVE=off): build-verify then shows it gives the Go bytes too
      - name: Build the ship ROM with every cache off
        env:
          DQ4_ASSETS: ${{ github.workspace }}/assets
          DQ4_READSET: 'off'
          DQ4_BUILD_CACHE: 'off'
          DQ4_SOUND_CACHE: 'off'
          VARIANT: ${{ matrix.variant }}
          ARGS: ${{ matrix.args }}
          NATIVE: ${{ matrix.native }}
        run: |
          args=()
          if [ -n "$ARGS" ]; then args=("$ARGS"); fi
          if [ -n "$NATIVE" ]; then export DQ4_NATIVE="$NATIVE"; fi
          if [ "$VARIANT" = ch1 ]; then
            # Under coverage (stage scripts too) for the release gate's local coverage (LOCAL_MIN)
            uv run --frozen python tools/release_check.py --ci-coverage build work/ci-digest/coverage-build.json \
              --build-out work/cold/ch1
          else
            uv run --frozen python sfc/dq4/tools/dq4build.py --out "work/cold/$VARIANT" "${args[@]}"
          fi

      - name: Hash the cold build for build-verify
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p work/ci-digest
          uv run --frozen python tools/ci_cache.py digest --dir "work/cold/$VARIANT" --variant "$VARIANT" --kind cold \
            --out "work/ci-digest/cold-$VARIANT.json"

      - name: Check the digest upload for ROM data
        id: digestcheck
        run: uv run --frozen python tools/ci_artifact_check.py work/ci-digest --hashes "$RUNNER_TEMP/rom-hashes.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.digestcheck.outcome == 'success' }}
        with:
          name: build-digest-${{ inputs.mode }}-cold-${{ matrix.variant }}
          path: work/ci-digest
          if-no-files-found: error
          retention-days: 14

      # After the upload, so build-verify still compares the bytes when this finds a missing key input.
      # Both variants in the ch1 job, which ends well before the Python-path ch2 job.
      - name: Check that every build stage cache key holds what the stage reads
        if: matrix.variant == 'ch1'
        env:
          DQ4_ASSETS: ${{ github.workspace }}/assets
          DQ4_READSET: 'off'
        run: |
          ok=0
          uv run --frozen python sfc/dq4/tools/dq4buildkeys.py || ok=1
          uv run --frozen python sfc/dq4/tools/dq4buildkeys.py --chapter2 || ok=1
          exit "$ok"

  # Fails the run as soon as both builds are in when the caches gave other bytes than the cold build.
  build-verify:
    needs: [build, rom, cold-build]
    if: ${{ always() && inputs.mode == 'release' && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-digest-${{ inputs.mode }}-*
          path: work/ci-digest

      - name: Compare the cached builds with the cold builds
        run: uv run --frozen python tools/ci_cache.py verify-build work/ci-digest

  shard:
    name: shard ${{ matrix.k }}
    needs: [build, rom]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libsdl2-2.0-0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: perfectacle/sfc-dq4-assets
          token: ${{ secrets.CI_ROM_TOKEN }}
          path: assets
          persist-credentials: false

      # Guard input keys read big folders by size and mtime; a fresh checkout would change every key.
      - name: Pin the asset checkout's file times to its commit
        run: git -C assets ls-files -z | (cd assets && xargs -0 touch -h -d "@$(git log -1 --format=%ct)")

      - uses: ./.github/actions/ci-tools # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/

      - uses: ./.github/actions/ci-roms # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          token: ${{ secrets.CI_ROM_TOKEN }}
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      - name: Restore the ch1 ship ROM built for this run
        uses: ./.github/actions/enc-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: restore
          name: ship-rom-ch1
          prefix: ship-rom-ch1-${{ github.run_id }}
          dir: work/ci-prebuilt/ch1
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      - name: Restore the ch2 ship ROM built for this run
        uses: ./.github/actions/enc-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: restore
          name: ship-rom-ch2
          prefix: ship-rom-ch2-${{ github.run_id }}
          dir: work/ci-prebuilt/ch2
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      # Some guards read work/ch1 or work/ch2 without building it (the local checkout keeps them);
      # the others' dq4build.py calls become copies of these (DQ4_PREBUILT, guards.with_prebuilt).
      - name: Put the ship ROMs in place
        run: |
          for v in ch1 ch2; do
            test -s "work/ci-prebuilt/$v/.prebuilt.json" || { echo "::error::rom job's $v build was not restored"; exit 1; }
            rm -rf "work/$v" && cp -R "work/ci-prebuilt/$v" "work/$v"
          done
          echo "DQ4_PREBUILT=$PWD/work/ci-prebuilt/ch1:$PWD/work/ci-prebuilt/ch2" >> "$GITHUB_ENV"

      # What this shard's guards really use, for the report job's comparison with the cold build
      - name: Hash the ship ROMs this shard got
        env:
          K: ${{ matrix.k }}
        run: |
          mkdir -p work/ci-gate
          for v in ch1 ch2; do
            uv run --frozen python tools/ci_cache.py digest --dir "work/ci-prebuilt/$v" --variant "$v" --kind "shard-$K" \
              --out "work/ci-gate/prebuilt-$v.json"
          done

      - name: Restore the sound conversion cache
        uses: ./.github/actions/enc-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: restore
          name: sound
          prefix: ship-sound-ch2
          dir: assets/sfc/dq4/cache/sound
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      - name: Mark the job start
        run: touch "$RUNNER_TEMP/job-start"

      # Pass records (input key, time) only, no ROM data, so a plain cache. The report job saves them.
      - name: Restore earlier guard passes
        if: inputs.cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/guards
          key: guard-results-restore
          restore-keys: guard-results-

      # Scene, start state and build stage caches are kept per guard unit (a guard or one of its parts), keyed by
      # the unit name, so any mode or shard count reads what another run left. A pull request restores only the
      # units it will run; the release modes restore every unit so the daily warm run keeps them from expiring.
      - name: List the shard's cache units
        if: inputs.cache
        env:
          DQ4_ASSETS: ${{ github.workspace }}/assets
          DQ4_UNIT_CACHE: ${{ github.workspace }}/work/cache/units
          K: ${{ matrix.k }}
          N: ${{ needs.build.outputs.count }}
          GUARDS: ${{ inputs.guards }}
          MODE: ${{ inputs.mode }}
          SWEEPS: ${{ inputs.sweeps }}
        run: |
          only=() pending=()
          if [ -n "$GUARDS" ]; then only=(--only "$GUARDS"); fi
          if [ "$SWEEPS" = true ]; then only+=(--sweeps); fi
          if [ "$MODE" = pr ]; then pending=(--pending-only); fi
          uv run --frozen python tools/guards.py --all "${only[@]}" --shard "$K/$N" --exclude-needs "$LOCAL_NEEDS" \
            --unit-slots "$RUNNER_TEMP/unit-slots.json" "${pending[@]}"

      - name: Restore the units' scene and state caches
        if: inputs.cache
        uses: ./.github/actions/unit-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: restore
          slots: ${{ runner.temp }}/unit-slots.json
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      - name: Run the shard's guards with caches
        if: inputs.cache
        env:
          DQ4_ASSETS: ${{ github.workspace }}/assets
          DQ4_UNIT_CACHE: ${{ github.workspace }}/work/cache/units
          HEADLESS_SLOTS: '4'
          DQ4_READSET_MAX_GB: '2'
          K: ${{ matrix.k }}
          N: ${{ needs.build.outputs.count }}
          GUARDS: ${{ inputs.guards }}
          SWEEPS: ${{ inputs.sweeps }}
        run: |
          mkdir -p work/ci-gate
          only=()
          if [ -n "$GUARDS" ]; then only=(--only "$GUARDS"); fi
          if [ "$SWEEPS" = true ]; then only+=(--sweeps); fi
          uv run --frozen python tools/guards.py --all "${only[@]}" --run --parallel 2 --timeout 3600 \
            --shard "$K/$N" --exclude-needs "$LOCAL_NEEDS" --json "work/ci-gate/shard-$K.json"

      - name: Run the shard's guards without caches
        if: ${{ !inputs.cache }}
        env:
          DQ4_ASSETS: ${{ github.workspace }}/assets
          HEADLESS_SLOTS: '4'
          K: ${{ matrix.k }}
          N: ${{ needs.build.outputs.count }}
          GUARDS: ${{ inputs.guards }}
          SWEEPS: ${{ inputs.sweeps }}
        run: |
          mkdir -p work/ci-gate
          only=()
          if [ -n "$GUARDS" ]; then only=(--only "$GUARDS"); fi
          if [ "$SWEEPS" = true ]; then only+=(--sweeps); fi
          # A 4-core runner is slower than the dev machine the 1800 s default fits
          # (dq4-compat-scenes took longer than that with every scene passing).
          uv run --frozen python tools/guards.py --all "${only[@]}" --run --no-cache --parallel 2 --timeout 3600 \
            --shard "$K/$N" --exclude-needs "$LOCAL_NEEDS" --json "work/ci-gate/shard-$K.json"

      - name: Drop build stage entries this job did not use
        if: ${{ !cancelled() && inputs.cache }}
        # Only units that wrote something this job: a restored unit whose guard was skipped keeps its entries.
        run: |
          for calls in work/cache/units/*/calls; do
            [ -d "$calls" ] || continue
            if [ -n "$(find "$(dirname "$calls")" -newer "$RUNNER_TEMP/job-start" -print -quit)" ]; then
              uv run --frozen python tools/ci_cache.py prune --dir "$calls" --since "$RUNNER_TEMP/job-start"
            fi
          done

      - name: Save the units' scene and state caches
        if: ${{ !cancelled() && inputs.cache }}
        uses: ./.github/actions/unit-cache # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
        with:
          op: save
          slots: ${{ runner.temp }}/unit-slots.json
          age_key: ${{ secrets.CI_ROM_AGE_KEY }}

      - name: Collect results
        if: always()
        env:
          K: ${{ matrix.k }}
        run: |
          rm -rf work/ci-upload && mkdir -p work/ci-upload/logs
          if [ -f "work/ci-gate/shard-$K.json" ]; then cp "work/ci-gate/shard-$K.json" work/ci-upload/; fi
          for f in work/ci-gate/prebuilt-*.json; do if [ -f "$f" ]; then cp "$f" work/ci-upload/; fi; done
          if [ -d work/guards ]; then find work/guards -maxdepth 1 -type f -name '*.log' -exec cp {} work/ci-upload/logs/ \;; fi
          if [ -d work/cache/guards ]; then mkdir -p work/ci-upload/results && cp -R work/cache/guards/. work/ci-upload/results/; fi
          # Scene logs the guards write under their own work folders, for diagnosing failures
          find work -path work/ci-upload -prune -o -path work/guards -prune -o -type f -name '*.log' -size -2M -print |
            while read -r f; do mkdir -p "work/ci-upload/scenes/$(dirname "$f")" && cp "$f" "work/ci-upload/scenes/$f"; done

      - name: Check the upload for ROM data
        id: leakcheck
        if: always()
        run: uv run --frozen python tools/ci_artifact_check.py work/ci-upload --hashes "$RUNNER_TEMP/rom-hashes.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.leakcheck.outcome == 'success' }}
        with:
          name: guard-shard-${{ inputs.mode }}-${{ matrix.k }}
          path: work/ci-upload
          if-no-files-found: error
          retention-days: 14

  report:
    needs: [build, shard, build-verify]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guard-shard-${{ inputs.mode }}-*
          path: work/ci-report

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.mode == 'release'
        with:
          pattern: build-digest-${{ inputs.mode }}-*
          path: work/ci-report/build-digest

      - name: Restore earlier guard passes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/guards
          key: guard-results-restore
          restore-keys: guard-results-

      - name: Merge this run's guard passes
        id: results
        run: |
          before=$(find work/cache/guards -type f 2>/dev/null | wc -l)
          mkdir -p work/cache/guards
          for d in work/ci-report/*/results; do [ -d "$d" ] && cp -R "$d/." work/cache/guards/; done
          after=$(find work/cache/guards -type f | wc -l)
          echo "새 통과 기록 $((after - before))개"
          if [ "$after" -gt "$before" ]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save the guard passes
        if: steps.results.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/guards
          key: guard-results-${{ github.run_id }}

      - name: Summarize the shards
        env:
          MODE: ${{ inputs.mode }}
          SWEEPS: ${{ inputs.sweeps }}
        run: |
          set -o pipefail
          need=()
          if [ "$MODE" = release ]; then need=(--require-build); fi
          # Only a run that took the sweeps must show every release.toml sweep passed (pr and cache-warm have none)
          if [ "$MODE" = release ] && [ "$SWEEPS" = true ]; then need+=(--require-sweeps); fi
          uv run --frozen python tools/release_check.py --ci-summary work/ci-report "${need[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
