name: ci

on:
  push:
    branches: [main]
  # No `edited`: a body edit would rerun the guard shards. Jobs that read the body fetch it from the API,
  # so after a body edit tools/ship.py reruns only required-checks.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs are superseded by newer pushes; main runs always finish.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only pr-guards (through guard-shards.yml) gets the ROM bundle; every other job checks what needs none.
  docs:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - run: uv run --frozen python tools/check_docs.py

  syntax:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - name: Check Lua syntax
        run: git ls-files -z '*.lua' | xargs -0 -n1 luac5.4 -p

      - run: uv sync --locked

      - run: git ls-files -z '*.py' | xargs -0 uv run --frozen python -m compileall -q

  # Tests that need rom/ skip themselves; the rest run here. One job per track so a
  # failure points at its owner. dq4 and dq5 take about two minutes each, so they
  # run as two shards balanced by tools/unitshard-times.json (tools/unitshard.py);
  # the other suites are short enough that a shard would cost more in runner setup.
  test:
    name: test (${{ matrix.track }}${{ matrix.n > 1 && format(' {0}/{1}', matrix.k, matrix.n) || '' }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {track: dq4, dir: sfc/dq4/tools, k: 1, n: 2}
          - {track: dq4, dir: sfc/dq4/tools, k: 2, n: 2}
          - {track: dq5, dir: sfc/dq5/tools/tests, k: 1, n: 2}
          - {track: dq5, dir: sfc/dq5/tools/tests, k: 2, n: 2}
          - {track: common, dir: tools/tests, k: 1, n: 1}
          - {track: fc-dq4, dir: fc/dq4/tools, k: 1, n: 1}
          - {track: nds, dir: nds/dq4/tools, k: 1, n: 1}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - name: Run the shard's test files
        working-directory: ${{ matrix.dir }}
        env:
          DIR: ${{ matrix.dir }}
          K: ${{ matrix.k }}
          N: ${{ matrix.n }}
        run: |
          read -ra mods <<< "$(uv run --frozen python "$GITHUB_WORKSPACE/tools/unitshard.py" "$DIR" "$K" "$N")"
          if [ "${#mods[@]}" -eq 0 ]; then echo "no test files in shard $K/$N of $DIR"; exit 1; fi
          uv run --frozen python -m unittest "${mods[@]}"

  actionlint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    env:
      ZIZMOR: zizmor==1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: pipx run --python "$(command -v python3)" "$ZIZMOR" --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  # Picks the run-time guards this PR (or push to main) touches (tools/guards.py --base: own paths, [full],
  # `가드: 전체`, `가드: 더함`) and splits them into the CI share and the local share (LOCAL_NEEDS in
  # guard-shards.yml). No secrets in this job. The guard job below decrypts the ROM bundle, so it waits for
  # the workflow protection tests of the same commit: a workflow edit that would leak the bundle fails here.
  # On main the same guards run again after a merge: caches saved by a PR run are visible only to that PR,
  # so main's run is what warms the build, scene and pass caches for the next PRs.
  guard-plan:
    if: github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      guards: ${{ steps.plan.outputs.guards }}
      local: ${{ steps.plan.outputs.local }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - name: Check the workflows keep the ROM secrets in
        run: uv run --frozen python -m unittest tools/tests/test_release_gate_workflow.py tools/tests/test_pr_guards_workflow.py

      - name: Plan the guards
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR" ]; then gh api "repos/$REPO/pulls/$PR" --jq .body > "$RUNNER_TEMP/pr-body.md"; else : > "$RUNNER_TEMP/pr-body.md"; fi
          if [ -n "$(git diff --name-only "$BASE...$HEAD_SHA" -- .github tools/ci_gate_setup.sh tools/ci_cache.py tools/ci_artifact_check.py)" ]; then
            echo "::notice::이 PR 은 워크플로·CI 비밀 처리 파일을 바꾼다: 보호 테스트를 통과해 가드 잡이 돈다(리뷰에서 그 파일을 볼 것)"
          fi
          uv run --frozen python tools/guards.py --base "$BASE" --head "$HEAD_SHA" --pr-body "$RUNNER_TEMP/pr-body.md" \
            --plan "$GITHUB_OUTPUT"

  # Same-repository branches and main only: a fork's code must never run with the ROM bundle secrets:
  # fork PRs skip this job and ci-ok rejects them (this repository takes no fork PRs).
  pr-guards:
    needs: guard-plan
    if: needs.guard-plan.outputs.guards != '' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/guard-shards.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      mode: pr
      guards: ${{ needs.guard-plan.outputs.guards }}
      shards: ${{ fromJSON(needs.guard-plan.outputs.shards) }}
      cache: true
    secrets:
      CI_ROM_TOKEN: ${{ secrets.CI_ROM_TOKEN }}
      CI_ROM_AGE_KEY: ${{ secrets.CI_ROM_AGE_KEY }}

  # One verdict for the guard job, which may be skipped for good reasons (no guards, a manual run).
  pr-guards-result:
    if: always()
    needs: [guard-plan, pr-guards]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - name: Judge the CI guards
        env:
          EVENT: ${{ github.event_name }}
          PLAN: ${{ needs.guard-plan.result }}
          GUARDS: ${{ needs.guard-plan.outputs.guards }}
          LOCAL: ${{ needs.guard-plan.outputs.local }}
          RESULT: ${{ needs.pr-guards.result }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; then echo "손으로 부른 실행: 실행 가드는 배포 관문 몫"; exit 0; fi
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" != true ]; then echo "::error::이 저장소는 포크 PR 을 받지 않는다"; exit 1; fi
          if [ "$PLAN" != success ]; then echo "::error::guard-plan 이 $PLAN"; exit 1; fi
          if [ -n "$LOCAL" ]; then echo "::notice::로컬 몫(본문 결과 줄로 판정): $LOCAL"; fi
          if [ -z "$GUARDS" ]; then echo "CI 가 돌릴 실행 가드 없음"; exit 0; fi
          if [ "$RESULT" = success ]; then echo "CI 가드 통과: $GUARDS"; exit 0; fi
          echo "::error::CI 가드 잡이 $RESULT: $GUARDS"
          exit 1

  # guards.toml format, and body result lines for the guards CI does not run: the local share (needs in
  # LOCAL_NEEDS, GUARD-02). The body comes from the API so a rerun of this job alone sees an edited body.
  required-checks:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - name: Check guard lists and the PR's guard results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gh api "repos/$REPO/pulls/$PR" --jq .body > "$RUNNER_TEMP/pr-body.md"
            uv run --frozen python tools/guards.py --base "$BASE" --head "$HEAD_SHA" --pr-body "$RUNNER_TEMP/pr-body.md" --local-only
          else
            uv run --frozen python tools/guards.py
          fi

  # The one required status check on main: passes only when every job above passed, and never for a
  # fork PR (GitHub cannot turn forking off on a user-owned public repository, so merging is what we block).
  ci-ok:
    if: always()
    needs: [docs, syntax, test, actionlint, zizmor, required-checks, pr-guards-result]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - name: Reject fork PRs
        env:
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" != true ]; then echo "::error::이 저장소는 포크 PR 을 받지 않는다"; exit 1; fi
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
