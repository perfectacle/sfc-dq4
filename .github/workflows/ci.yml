name: ci

on:
  push:
    branches: [main]
  pull_request:
    # edited: fixing a guard result line in the PR body reruns required-checks
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs are superseded by newer pushes; main runs always finish.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No ROM in CI: every job checks only what needs none.
  docs:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - run: uv run --frozen python tools/check_docs.py

  syntax:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - name: Check Lua syntax
        run: git ls-files -z '*.lua' | xargs -0 -n1 luac5.4 -p

      - run: uv sync --locked

      - run: git ls-files -z '*.py' | xargs -0 uv run --frozen python -m compileall -q

  # Tests that need rom/ skip themselves; the rest run here. One job per track so a
  # failure points at its owner. dq4 and dq5 take about two minutes each, so they
  # run as two shards balanced by tools/unitshard-times.json (tools/unitshard.py);
  # the other suites are short enough that a shard would cost more in runner setup.
  test:
    name: test (${{ matrix.track }}${{ matrix.n > 1 && format(' {0}/{1}', matrix.k, matrix.n) || '' }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {track: dq4, dir: sfc/dq4/tools, k: 1, n: 2}
          - {track: dq4, dir: sfc/dq4/tools, k: 2, n: 2}
          - {track: dq5, dir: sfc/dq5/tools/tests, k: 1, n: 2}
          - {track: dq5, dir: sfc/dq5/tools/tests, k: 2, n: 2}
          - {track: common, dir: tools/tests, k: 1, n: 1}
          - {track: fc-dq4, dir: fc/dq4/tools, k: 1, n: 1}
          - {track: nds, dir: nds/dq4/tools, k: 1, n: 1}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - name: Run the shard's test files
        working-directory: ${{ matrix.dir }}
        env:
          DIR: ${{ matrix.dir }}
          K: ${{ matrix.k }}
          N: ${{ matrix.n }}
        run: |
          read -ra mods <<< "$(uv run --frozen python "$GITHUB_WORKSPACE/tools/unitshard.py" "$DIR" "$K" "$N")"
          if [ "${#mods[@]}" -eq 0 ]; then echo "no test files in shard $K/$N of $DIR"; exit 1; fi
          uv run --frozen python -m unittest "${mods[@]}"

  actionlint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    env:
      ZIZMOR: zizmor==1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: pipx run --python "$(command -v python3)" "$ZIZMOR" --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  # Run-time guards need the ROM, so CI only checks that a PR touching a guard's
  # own paths reports its result in the body (tools/guards.py, GUARD-02). Guards
  # matched only through [groups] and tier = "release" guards are left to the
  # release gate. A changed file matching a track's [full] paths asks for every
  # guard of that track; a `가드: 전체` body line asks for every guard.
  required-checks:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true

      - run: uv sync --locked

      - name: Check guard lists and the PR's guard results
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
            uv run --frozen python tools/guards.py --base "$BASE" --head "$HEAD_SHA" --pr-body "$RUNNER_TEMP/pr-body.md"
          else
            uv run --frozen python tools/guards.py
          fi

  # The one required status check on main: passes only when every job above passed.
  ci-ok:
    if: always()
    needs: [docs, syntax, test, actionlint, zizmor, required-checks]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
