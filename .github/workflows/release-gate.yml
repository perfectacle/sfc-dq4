name: release-gate

# Every run-time guard on CI runners (guards whose needs name LOCAL_NEEDS of
# guard-shards.yml stay with the local release gate). Manual only: it passes the ROM
# bundle secrets to guard-shards.yml, so it must never run for pull requests or on a
# schedule (tools/tests/test_release_gate_workflow.py keeps it that way).
# Format: sfc/dq4/docs/dq4-release-check-format.md
on:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of guard shards (1-64)
        type: number
        default: 16
      ref:
        description: Branch, tag or commit to check
        type: string
        default: main
      rehearse:
        description: Use the build, scene and state caches and earlier passes (fast; a rehearsal, not release evidence)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-gate-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/guard-shards.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects $/
    with:
      ref: ${{ inputs.ref }}
      mode: release
      cache: ${{ inputs.rehearse }}
      shards: ${{ fromJSON(inputs.shards) }}
    secrets:
      CI_ROM_TOKEN: ${{ secrets.CI_ROM_TOKEN }}
      CI_ROM_AGE_KEY: ${{ secrets.CI_ROM_AGE_KEY }}
