name = "dq4-ch3-lakanaba"
why = "3장 레이크나바 사건(dq4ch3lakanaba): 네네(오늘 도시락 전이면 잠 → HP·MP 채움·아침·날수 + 1 → 도시락, 받은 뒤엔 한마디), 무기점 첫 출근(문 앞 꾸지람 → 카운터 안으로)·둘째 날(카운터 안 주인에게 「예」)·카운터 너머, 손님 갈래를 문턱을 바꾼 롬 사본으로(파는 손님 はじゃのつるぎ 재고 + 1, 사는 손님 돈 모자람·소지품 가득·장비 못 함·팜, 값 물음 「아니오」 뒤 깎음·웃돈·흥정 없음의 일삯), 일삯 100 이상이면 가게를 닫고 밤(0341), 아래층에서 그만두기, 톰 노인 밀기·교회 도착 골드, 톰 아들의 개(DOG)·우리의 개 숨기, 필드에서 돌아오면 오늘 도시락·출근 flag 지움. 메시지 차례·flag·금화·일삯·재고를 보고 두 번 돌려 같아야 한다"
