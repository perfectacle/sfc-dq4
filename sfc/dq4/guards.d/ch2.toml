# 2장 사건 모듈과 모듈만 닿는 자료, 등록 장치(test_dq4guardpaths 가 dq4ch2event.EVENTS 와 견줌). 2장 모듈은 기본 인물
# 목록·대화 번호·메시지 번호·그림 배치를 바꿀 수 있어 2장 검사와 1장 내용 검사(CH2_REQUIRED)가 paths 에
# "@ch2-modules" 로 잡는다. 새 모듈 dq4ch2<이름>.py 는 glob 에 들어 이 목록을 고치지 않는다
[groups]
ch2-modules = [
  "sfc/dq4/tools/dq4ch2*.py",
  "!sfc/dq4/tools/dq4ch2*check.py",
  "!sfc/dq4/tools/dq4ch2*_checks.py",
  "!sfc/dq4/tools/dq4ch2checks.py",
  "!sfc/dq4/tools/dq4ch2walkparts.py",
  "sfc/dq4/tools/dq4ch2partytalk*.tsv",
]
