# 2장 검사. 형식은 tools/guards.py(트랙 sfc/dq4 의 조각), 규칙은 guards 스킬

[[check]]
name = "dq4-ch2-walk"
why = "2장 사건 처음부터 끝까지(첫머리~텐페·프레놀·왕 병·사당·엔돌 대회·빈 성·장 끝 상자)를 묶음마다 따로 걸어 flag·끝 맵·끝 셀·바이트를 본다. 엔돌 쪽 사당 → 엔돌, 사란 → 성문 → 장 끝은 필드를 걷고, 장 끝 서술 동안 지금 곡이 엔딩 곡 13 인지 본다. 두 번 걸어 기록이 같아야 하고(운으로 통과 금지), 걸어 다니는 브라이를 묶지 않으면 시드 5·9 에서 말 상대가 비켜 섰다"
paths = [
  "@ch3-modules",
  "sfc/dq4/tools/dq4ch2*.py",
  "sfc/dq4/tools/dq4chapterwalk.py",
  "sfc/dq4/tools/dq4ch1walkcheck.py",
  "sfc/dq4/tools/dq4msglabels.py",
  "sfc/dq4/tools/lua/dq4walkstate.lua",
  "sfc/dq4/tools/lua/dq4warpmsg.lua",
  "tools/mesence_settings.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch2 --chapter2 && rm -rf work/ch2walk && uv run --locked python sfc/dq4/tools/dq4ch2walkcheck.py --rom work/ch2/dq4-ch1-full.sfc --out work/ch2walk --repeat 2"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "출발 상태는 검사 롬으로 만듦(서장 끝·2장 출발 상태 캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]
groups = ["ch1-build", "ch1-walk"]

[[check]]
name = "dq4-ch2-field-walk"
tier = "release"
why = "2장 사건 사이 필드 길을 순간이동 없이 걷는다(산트하임 성 → 사란 → 텐페 → 프레놀 → 남쪽 동굴 → 프레놀 → 바자 → 텐페 → 성 → 이쪽 사당 → 서쪽 탑 → 성 → 사당, 엔돌 → 엔돌 쪽 사당 → 여행의 문 → 텐페 → 성, 그리고 2장 걷기 검사의 사당 → 엔돌·사란 → 성문 묶음). 길마다 그 앞 사건까지의 flag 로 출발지 도착 칸에 내려, 나가는 길로 필드의 나오는 칸에 서는지, FC 필드 속성으로 찾은 길을 걸어 다음 곳의 입구에서 그 FC 그룹의 도착 맵·칸에 드는지 본다. 텐페 블록이 산트하임 쪽과 프레놀 쪽을 잇는 유일한 칸이라, 텐페 위 가장자리로 나가면 북쪽에 서야 한다(dq4groupbuild LINKS leave_rows). 두 번 걸어 기록이 같아야 한다"
paths = [
  "@ch2-modules",
  "sfc/dq4/tools/dq4ch2checks.py",
  "sfc/dq4/tools/dq4ch2walkparts.py",
  "sfc/dq4/tools/dq4ch2*_checks.py",
  "sfc/dq4/tools/dq4ch2fieldwalkcheck.py",
  "sfc/dq4/tools/dq4ch2walkcheck.py",
  "sfc/dq4/tools/dq4chapterwalk.py",
  "sfc/dq4/tools/dq4groupbuild.py",
  "tools/mesence_settings.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch2 --chapter2 && rm -rf work/ch2field && uv run --locked python sfc/dq4/tools/dq4ch2fieldwalkcheck.py --rom work/ch2/dq4-ch1-full.sfc --out work/ch2field --repeat 2"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "출발 상태는 검사 롬으로 만듦(2장 출발 상태 캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]
groups = ["ch1-build", "ch1-walk"]

