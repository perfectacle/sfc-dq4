# 3장 마을 사람(dq4ch3towns) 사건 모듈의 검사. 형식은 tools/guards.py(트랙 sfc/dq4 의 조각), 규칙은 guards 스킬

[[check]]
name = "dq4-ch3-towns"
why = "3장 마을 사람(dq4ch3towns): 3장 그룹 맵마다 3장 동안 걸릴 수 있는 인물 목록의 모든 대화 갈래가 띄우는 메시지에 가나·한자가 0 이고(다른 모듈 몫으로 남긴 사람은 그 모듈 파일이 생기면 함께 0), 한글 메시지가 창을 넘지 않는지(dq4ch3townscheck). 사건 flag 하나씩(아들이 돌아옴·여우를 쫓음·왕자의 편지·왕자를 만남(들 때·든 뒤)·가게를 삼·공사 재개)을 켜고 말을 바꾼 사람의 첫 메시지를 걷는 사람까지 걸음을 멈춰 본다(npccheck --states). 공사 재개 뒤에는 열린 카지노가 걸려야 한다. 엔돌은 FC 3장 목록대로 사람이 바뀌고 카지노는 닫혀 있어야 한다: 기본 목록(2장 대회 중)이나 2장 끝 우승 목록이 3장에 걸렸었다"
