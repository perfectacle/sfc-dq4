# 3장 엔돌(dq4ch3endor) 사건 모듈의 검사. 형식은 tools/guards.py(트랙 sfc/dq4 의 조각), 규칙은 guards 스킬

[[check]]
name = "dq4-ch3-endor"
why = "3장 엔돌 사건의 대화 갈래: 왕(첫 알현 「아니요」·편지 기다림·납품 뒤), 가게 주인 「아니요」(금화 그대로), 밤의 아들·네네(잠 뒤 아침 마을), 네네 「아니요」·개통 거짓말 갈래, 납품(주문 전·「아니요」·다 채운 뒤)과 안내인, 수집가(여신상 없음·「아니요」·판 뒤), 여신상 동굴 단추 「아니요」, 네네 가게(카운터 너머 매상 받기·물건 내놓기, 가게 물건 보기 창을 열고 닫아도 가게 칸·소지품·장비가 그대로, 소지품·가게가 빌 때의 0334·0376, 잠 뒤 난수를 고정한 팔림·안 팔림, 팔린 칸 당김, 가게 물건 11개를 FC 꼴 보기 창 두 쪽으로 넘겨 봄, 저장 → 리셋 → 모험의 서 베끼기·지우기에서 가게 120칸이 기록과 함께 가고 지워짐)를 3장 출발 상태에서 걸어 메시지 차례와 flag 를 본다. 대화 스크립트 갈래·메시지 차례(dq4ch3endor.MESSAGES)·3장 엔돌 대체 목록을 바꾸면 깨진다. 큰 길은 dq4-ch3-walk 의 endor_* 구간이 본다. 두 번 걸어 기록이 같아야 한다"
paths = [
  "@ch3-modules",
  "sfc/dq4/tools/dq4ch3endorcheck.py",
  "sfc/dq4/tools/dq4ch3walkcheck.py",
  "sfc/dq4/tools/dq4chapterwalk.py",
  "sfc/dq4/tools/dq4ch1walkcheck.py",
  "sfc/dq4/tools/dq4msglabels.py",
  "sfc/dq4/tools/dq4npcport.py",
  "sfc/dq4/tools/lua/dq4walkstate.lua",
  "sfc/dq4/tools/lua/dq4walk.lua",
  "sfc/dq4/tools/lua/dq4warpmsg.lua",
  "tools/mesence_settings.py",
  "sfc/dq4/tools/dq4ch3*.py",
  "sfc/dq4/tools/dq4eventchecks.py",
  "sfc/dq4/tools/dq4groupbuild.py",
  "sfc/dq4/tools/dq4ch1savecheck.py",
  "sfc/dq4/tools/dq4dungeonencountercheck.py",
  "sfc/dq4/tools/dq4freshstate.py",
  "sfc/dq4/tools/dq4groupcheck.py",
  "sfc/dq4/tools/dq4shards.py",
  "sfc/dq4/tools/dq4wellresetcheck.py",
  "sfc/dq4/tools/lua/dq4shipstate.lua",
  "sfc/dq5/tools/dq5progresscheck.py",
  "sfc/dq5/tools/dq5sram.py",
  "sfc/dq5/tools/lua/dq5battle.lua",
  "sfc/dq5/tools/lua/dq5cdldump.lua",
  "sfc/dq5/tools/lua/dq5progresscheck.lua",
  "sfc/dq5/tools/lua/dq5warptrace.lua",
  "sfc/dq4/tools/dq4winwatch.py",
  "sfc/dq4/tools/dq4winrule_*.py",
  "sfc/dq4/tools/dq4wintext.py",
  "sfc/dq4/tools/lua/dq4winwatch.lua",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch3 --chapter3 && rm -rf work/ch3endor && uv run --locked python sfc/dq4/tools/dq4ch3endorcheck.py --rom work/ch3/dq4-ch1-full.sfc --out work/ch3endor --repeat 2"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "출발 상태는 검사 롬으로 만듦(서장 끝·2장 출발 상태·3장 출발 상태 캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]
groups = ["ch1-build", "ch1-walk"]

# 엔돌 모듈만 닿는 도우미(네네 가게). 3장 사건 모듈 묶음에 더한다
[groups]
ch3-modules = ["sfc/dq4/tools/dq4neneshop.py"]
