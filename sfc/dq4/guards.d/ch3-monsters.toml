[[check]]
name = "dq4-ch3-monsters"
why = "3장 몬스터가 FC 대로여야 한다: 3장 구역 19종의 레코드가 FC 능력치·행동·내성·드롭(새 6종은 2장 예비였던 C5·B6·9D·A5·E3·3D), 3장 구역 레코드·고정 무리(FC 17 필드 편성)가 docs 대로, 3장 필드 구역 낮·밤에서 무리 고르기 훅(첫 칸·셋째 넷째·둘째부터, 1~3장 공통)이 들어올 때의 난수 상태로 FC 모형(fc_pick·바이트 14·15)이 낸 것과 같고 낮에는 FC 의 밤 칸(メラゴースト·밤 ホイミスライム 무리)이 나오지 않음, 전투 뒤 물건은 FC 3장 전용 16칸 표(문턱 0 칸은 톨네코 레벨)를 굴린 결과가 모형(drop_roll)과 같고 그 물건이 가방에 듦, 3장 flag 가 꺼지면 표를 굴리지 않음. 떠돌이 상인: rand(10) = 0 일 때만 싸우지 않고 도구점(약초를 사면 금화·가방)·여관(1인 10G, 깬 뒤 필드에 남음 — 필드 $BC 01 이 DQ5 그룹 01 여관 갈래로 01/00 안에 세우던 것)을 열고, 3장 flag 없이는 열지 않음. 맡기는 곳 수수료(dq4bankfee, 상인 대화 번호를 04 로 덮어 엶): 맡길 때 안내 0AA, 돌려받을 때 0AA 뒤 금화 -10, 금화가 10 보다 적으면 0C2 로 돌려주지 않고(맡긴 돈이 있으면 돈 돌려받기 0CD) 금화 그대로"
paths = [
  "@ch3-modules",
  "sfc/dq4/tools/dq4ch3monstercheck.py",
  "sfc/dq4/tools/dq4bankfee.py",
  "sfc/dq4/tools/dq4sysmsg.py",
  "sfc/dq4/tools/dq4shards.py",
  "sfc/dq4/tools/dq4windowcheck.py",
  "sfc/dq4/tools/lua/dq4battle.lua",
  "sfc/dq4/tools/lua/dq4shipstate.lua",
  "sfc/dq5/tools/dq5progresscheck.py",
  "sfc/dq5/tools/lua/dq5battle.lua",
  "sfc/dq5/tools/lua/dq5progresscheck.lua",
  "sfc/dq4/tools/dq4monport.py",
  "sfc/dq4/tools/dq4monspecial.py",
  "sfc/dq4/tools/dq4fieldencounter.py",
  "sfc/dq4/tools/dq4fieldencountercheck.py",
  "sfc/dq4/tools/dq4groupbuild.py",
  "sfc/dq4/tools/dq4groupcheck.py",
  "sfc/dq4/tools/dq4battlecheck.py",
  "sfc/dq4/tools/dq4ch3event.py",
  "sfc/dq4/tools/dq4shopport.py",
  "sfc/dq4/tools/dq4shopkey.py",
  "sfc/dq4/tools/dq4itemport.py",
  "sfc/dq4/tools/dq4freshstate.py",
  "sfc/dq4/tools/dq4readset.py",
  "sfc/dq4/tools/lua/dq4readset.lua",
  "sfc/dq5/tools/lua/dq5warptrace.lua",
  "sfc/dq5/tools/lua/dq5warp.lua",
  "fc/dq4/tools/dq4encounter.py",
  "fc/dq4/tools/dq4data.py",
  "tools/mesence_settings.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch3 --chapter3 && rm -rf work/ch3monsters && uv run --locked python sfc/dq4/tools/dq4ch3monstercheck.py --rom work/ch3/dq4-ch1-full.sfc --out work/ch3monsters --jobs 4"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "출발 상태는 검사 롬으로 만듦(서장 끝 캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]
groups = ["ch1-build", "ch1-walk"]
