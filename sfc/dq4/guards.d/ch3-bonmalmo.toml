# 3장 본몰·여우 마을(dq4ch3bonmalmo) 사건 모듈의 검사. 형식은 tools/guards.py(트랙 sfc/dq4 의 조각), 규칙은 guards 스킬

[[check]]
name = "dq4-ch3-bonmalmo"
why = "3장 다리: 필드를 불러올 때(01:9FD2 의 JSL) 다리가 고쳐지기 전이면 FC 다리 칸(블록 16 여덟 칸)을 막힌 블록으로 바꾸는 훅(dq4ch3bonmalmo.hooks)이 원래 대상(움직이는 바다 01:C5C8)을 이어 부르며 걸려 있는지, 여우를 쫓은 뒤 들어갈 때 숲을 고르는 입구 앞 훅(2A:F28D)이 입구 훅으로 이어지는지, 사건 네이티브가 제자리인지 빌드 롬에서 본다. 다리 막힘·고친 뒤 건너기와 사건 장면은 dq4-ch3-walk·dq4-ch3-heroblock·dq4-ch3-npc 가 본다"
paths = [
  "@ch3-modules",
  "sfc/dq4/tools/test_dq4ch3bonmalmo.py",
  "sfc/dq4/tools/dq4fieldport.py",
  "fc/dq4/tools/dq4field.py",
  "sfc/dq4/tools/dq4ch3*.py",
  "sfc/dq4/tools/dq4eventchecks.py",
  "sfc/dq4/tools/dq4npcport.py",
  "sfc/dq4/tools/dq4groupbuild.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch3 --chapter3 && DQ4_CH3_ROM=work/ch3/dq4-ch1-full.sfc uv run --locked python -m unittest discover -s sfc/dq4/tools -p test_dq4ch3bonmalmo.py -k BuiltRomTest 2>&1 | tee work/ch3bonmalmo.log | tail -1 | grep -qx OK"
needs = ["rom", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS"]
groups = ["ch1-build"]
