# 공격 효과 하위 스크립트마다 해킹 롬의 전투 큰 그림 길이 원본 DQ5 와 같은지(결정적). 형식은 tools/guards.py, 규칙은 guards 스킬

[[check]]
name = "dq4-battle-bigpic-sub"
why = "전투 큰 그림 길에는 창 글자 대기열이 돌지 않아 그 길이만큼 대기열이 늦는다. 공격 효과는 무기·회심으로 고른 하위 스크립트($9E74)대로 큰 그림을 요청하고 그 길이는 원본 DQ5 엔진이 정한다(회심 구리 검 11, 원본 실측 2~20 NMI). 들판 전투의 첫 공격에서 하위 스크립트를 하나씩 강제해 요청 합이 원본과 같고 가장 긴 길이 원본 이하이며, 그 길에 넣은 항목이 길이 끝난 뒤 AFTER NMI 안에 나가야 한다. 원본 표는 sfc/dq4/bigpic-orig.toml(--measure-original 로 다시 잼). 해킹이 효과에 요청을 더하거나 대기열 게이트가 길 뒤 NMI 를 놓치면 깨진다"
