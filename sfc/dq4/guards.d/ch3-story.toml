# 3장 첫머리부터 장 끝 상자까지 한 줄로 걷는 검사. 형식은 tools/guards.py(트랙 sfc/dq4 의 조각), 규칙은 guards 스킬

[[check]]
name = "dq4-ch3-story"
tier = "release"
parts = 3
why = "3장을 처음부터 끝까지 순간이동 없이, 사건 flag·사건 물건·자리를 써 넣지 않고 걸을 수 있어야 한다(금화와 납품 무기만 써 넣고 표로 남김). 첫머리 → 무기점 첫 출근·손님을 가게 닫을 때까지 → 네네의 잠 → 키메라의 날개 → 북쪽 동굴 수문·구르는 바위·철 금고와 나오는 길 → 본몰 여관·낮 왕자·밤 편지·감옥의 아들 → 톰의 아들에게서 개 → 여우 마을 강철 갑옷 → 다리 앞 걸음 전투 뒤에도 고치기 전 다리는 막힘 → 본몰 왕이 다리를 고침 → 엔돌 왕 첫 알현·모니카·왕의 편지·허락·가게 사기 → 여신상 동굴 배·단추·여신상·수집가 → 용병 로렌스를 고용해 다섯 밤 뒤 필드에서 떠남 → 왕의 주문·납품 60000 → 굴 공사비·재개·개통 소식·네네 → 뚫린 굴 → 장 끝 서술·엔딩 곡·끝 상자·리셋. 사건 모듈을 따로 만들어 합친 이음매(굴 개통이 엔돌 네네에게, 본몰 모니카가 엔돌 목록에)가 깨지면 잡힌다. 시드 0·5·9 마다 두 번 걸어 기록이 같아야 한다"
paths = [
  "sfc/dq4/tools/dq4story3check.py",
  "sfc/dq4/tools/dq4story3.py",
  "sfc/dq4/tools/lua/dq4storywalk.lua",
  "sfc/dq4/tools/dq4storytokens.py",
  "sfc/dq4/tools/dq4ch3*.py",
  "sfc/dq4/tools/dq4eventchecks.py",
  "@ch3-modules",
  "sfc/dq4/tools/dq4chapterwalk.py",
  "sfc/dq4/tools/dq4ch2walkcheck.py",
  "sfc/dq4/tools/dq4ch2event.py",
  "sfc/dq4/tools/dq4ch2ending.py",
  "sfc/dq4/tools/dq4chapterbox.py",
  "sfc/dq4/tools/dq4ch1walkcheck.py",
  "sfc/dq4/tools/dq4battlecheck.py",
  "sfc/dq4/tools/dq4windowcheck.py",
  "sfc/dq4/tools/lua/dq4battle.lua",
  "sfc/dq4/tools/dq4monport.py",
  "sfc/dq4/tools/dq4monspecial.py",
  "sfc/dq4/tools/dq4shards.py",
  "sfc/dq4/tools/lua/dq4walkstate.lua",
  "sfc/dq4/tools/lua/dq4warpmsg.lua",
  "tools/mesence_settings.py",
  "sfc/dq4/tools/dq4npcport.py",
  "sfc/dq4/tools/dq4groupbuild.py",
  "sfc/dq4/tools/dq4shopport.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch3 --chapter3 && rm -rf work/ch3story && uv run --locked python sfc/dq4/tools/dq4story3check.py --rom work/ch3/dq4-ch1-full.sfc --out work/ch3story --seeds 0,5,9 --repeat 2"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "출발 상태는 검사 롬으로 만듦(서장 끝·2장 출발 상태·3장 출발 상태 캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]
groups = ["ch1-build", "ch1-walk"]

