# DQ5 자리를 빌린 FC 물건(dq4fcitems)의 쓰기 효과 검사. 형식은 tools/guards.py(트랙 sfc/dq4 의 조각), 규칙은 guards 스킬

[[check]]
name = "dq4-fc-items"
why = "DQ5 에 없는 FC 물건을 빌린 자리에서 쓰면 FC 효과가 나야 한다. 운의 씨앗(AE, DQ5 まもりのたね 자리)은 필드에서 운(7E:204A)을 1~3 올리고 없어진다. 처리기 11:89A4 를 운 칸(23)으로 고친 것이 빠지면 방어력이 4 오르는 DQ5 효과로 돌아간다. 말똥(C2)·정적의 구슬(C4)·승선권(C1)은 FC 처럼 「그러나 아무 일도 일어나지 않았다.」(いのちのいし 처리기 11:8BB9) 뒤 남는다. 말똥의 「쓰면 남음」(k1 bit5 끔)이 빠지면 いのちのいし 처럼 없어지고, 구슬·승선권의 처리기를 빌리지 않으면 たたかいのドラム·てんしのすず 처리기가 돈다. 전투 쓰기는 dq4-battle-scene 의 luck 장면이 본다"
paths = [
  "sfc/dq4/tools/dq4fcitems.py",
  "sfc/dq4/tools/dq4fcitemcheck.py",
  "sfc/dq4/tools/dq4itemport.py",
  "sfc/dq4/tools/dq4storyitemcheck.py",
  "sfc/dq4/tools/lua/dq4itemuse.lua",
  "sfc/dq4/tools/dq4doorcheck.py",
  "sfc/dq4/tools/dq4freshstate.py",
  "sfc/dq4/tools/lua/dq4doorwalk.lua",
  "sfc/dq5/tools/lua/dq5warp.lua",
  "tools/mesence_settings.py",
  "sfc/dq4/tools/dq4groupcheck.py",
  "sfc/dq4/tools/dq4shards.py",
  "sfc/dq4/tools/lua/dq4shipstate.lua",
  "sfc/dq5/tools/dq5progresscheck.py",
  "sfc/dq5/tools/lua/dq5battle.lua",
  "sfc/dq5/tools/lua/dq5progresscheck.lua",
  "sfc/dq5/tools/lua/dq5warptrace.lua",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch2 --chapter2 && rm -rf work/fcitem && uv run --locked python sfc/dq4/tools/dq4fcitemcheck.py --rom work/ch2/dq4-ch1-full.sfc --out work/fcitem"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "출발 상태는 검사 롬으로 만듦(캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]
groups = ["ch1-build", "ch1-walk"]
