name = "dq4-ch3-compat-walk"
why = "3장 길을 MesenCE 밖에서도 걷는지: libretro bsnes·snes9x 에서 서장 → 1장 왕 보고 → 2장 첫머리 → 빈 성 → 2장 끝 → 3장 첫머리를 잇고, 3장 사건 묶음을 3장 출발 상태에서 걷는다"
paths = [
  "sfc/dq4/tools/dq4ch2checks.py",
  "sfc/dq4/tools/dq4ch2walkparts.py",
  "sfc/dq4/tools/dq4ch2*_checks.py",
  "sfc/dq4/tools/dq4*event.py",
  "sfc/dq4/tools/dq4chapter*.py",
  "sfc/dq4/tools/*.asm",
  "sfc/dq4/tools/dq4compatcheck.py",
  "sfc/dq4/tools/dq4chapterwalk.py",
  "sfc/dq4/tools/dq4ch3*.py",
  "sfc/dq4/tools/dq4eventchecks.py",
  "@ch3-modules",
  "sfc/dq4/tools/dq4ch2walkcheck.py",
  "sfc/dq4/tools/dq4ch2ending.py",
  "sfc/dq4/tools/dq4libretro.py",
  "sfc/dq4/tools/dq4cores.py",
  "sfc/dq4/tools/dq4cores-bsnes-romtrace.patch",
  "sfc/dq4/tools/dq4ch1walkcheck.py",
  "sfc/dq4/tools/lua/dq4walk.lua",
  "sfc/dq4/tools/dq4msglabels.py",
  "sfc/dq4/tools/dq4pins.py",
  "sfc/dq4/tools/dq4prologuecheck.py",
  "sfc/dq4/tools/dq4brkscan.py",
  "sfc/dq4/tools/dq4npcport.py",
  "sfc/dq4/tools/dq4groupbuild.py",
  "sfc/dq4/tools/dq4fcslot.py",
  "sfc/dq4/tools/dq4fcpoker.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4cores.py && uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch3 --chapter3 && rm -rf work/ch3compat && uv run --locked python sfc/dq4/tools/dq4compatcheck.py walk --chapter3 --rom work/ch3/dq4-ch1-full.sfc --out work/ch3compat --jobs 4"
needs = ["rom", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "dq4cores.py 로 빌드한 코어(또는 LIBRETRO_BSNES·LIBRETRO_SNES9X)"]
groups = ["ch1-build", "ch1-walk"]

# 3장 사건 모듈과 모듈만 닿는 파일, 등록 장치(dq4guardpaths.ch3_module_files 와 같음, test_dq4guardpaths 가 지킴).
# 빌드가 모듈을 importlib 로 들여 import 길로 닿지 않으므로, 모듈이 싣는 롬 내용을 보는 검사는 paths 에 "@ch3-modules" 로
# (PR 에서 건다), 모듈 _checks 표를 거쳐 import 로만 닿는 검사는 groups 키로(배포 관문) 잡는다. 새 모듈 dq4ch3<이름>.py 는
# glob 에 들어 이 목록을 고치지 않는다. 모듈만 닿는 다른 이름의 도우미는 그 모듈 조각의 [groups] 에 같은 이름으로 더한다
[groups]
ch3-modules = [
  "sfc/dq4/tools/dq4ch3*.py",
  "!sfc/dq4/tools/dq4ch3*check.py",
  "!sfc/dq4/tools/dq4ch3*_checks.py",
  "!sfc/dq4/tools/dq4ch3checks.py",
  "!sfc/dq4/tools/dq4ch3walkparts.py",
  "sfc/dq4/tools/dq4boulder.py",
  "sfc/dq4/tools/dq4mercenary.py",
  "sfc/dq4/tools/dq4raft.py",
]
