  "sfc/dq5/tools/lua/dq5progresscheck.lua",
  "sfc/dq5/tools/lua/dq5textgrowcheck.lua",
  "sfc/dq4/tools/lua/dq4holdwalk.lua",
  "sfc/dq4/tools/lua/dq4shipstate.lua",
  "sfc/dq5/tools/dq5npcrecordcheck.py",
  "tools/mesence_settings.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch2 --chapter2 && uv run --locked python sfc/dq4/tools/dq4chapter1.py build --rom work/ch2/menu.sfc --keep work/ch2/keep --chapter2 --out work/ch2/npc.sfc && rm -rf work/ch2npc && uv run --locked python sfc/dq4/tools/dq4npccheck.py --chapter2 --rom work/ch2/npc.sfc --build work/ch2/keep/groups --texts work/ch2/messages.json --out work/ch2npc --jobs 4"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "출발 상태는 검사 롬으로 만듦(서장 끝·2장 출발 상태 캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]
