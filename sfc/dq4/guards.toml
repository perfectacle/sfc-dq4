[[check]]
name = "dq4-sfx-scene"
why = "손으로 적은 효과음 결정 표의 동작마다(문·계단·상자·항아리·메뉴·대화·여관·교회·전투 공격·무기 27가지·주문·맞음·빗나감·회심·보스·スカラ·도망·레벨 업·서장 수련·개구리) 소리 대기열에 기대한 (명령, 효과음, 갈래)가 들어가고, 항목마다 울림 하나가 짝지어지고, 울린 소리의 바탕(원본 DQ5 샘플·NDS·잡음)이 결정과 같은지(bsnes·snes9x, 배포 롬 장면 둘 포함). 대응표와 결정 표의 어긋남, --sfx-call 자리·무기 표 롬 바이트, 「부를 수 없음」 까닭도 본다. 회심은 검사 롬 사본의 판정 난수 범위를 1 로 고정해 일으키므로 회심 난수 굴림(00:953A 의 0~31)은 다루지 않는다. 판정 앞 조건 셋($100E bit7, 일행 전투 칸 여덟의 +7 bit6, 26:8D0A 가진 물건)은 공격 소리 프레임에 모두 꺼져 있어야 하고, 켜져 있으면 그 까닭을 대며, 기록이 비면 따로 실패한다"
