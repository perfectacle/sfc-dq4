# 롬·에뮬레이터가 있어야 도는 dq4 회귀 가드. 형식은 tools/guards.py, 규칙은 guards 스킬(GUARD-01~03)

[[check]]
name = "dq4-window-check"
why = "창 글자 깨짐·비침(#911 가게 동료 창 2프레임 깨짐 shopflip, #916·#918·#922 가게 목록·동료 창·사기 확인 shopwho)이 다시 생기지 않게"
paths = ["sfc/dq4/tools/dq4windowname.asm", "sfc/dq4/tools/dq4windowname.py", "sfc/dq4/tools/dq4windowtext.py",
         "sfc/dq4/tools/dq4windowcheck.py", "sfc/dq4/tools/dq4bg3slot.py"]
run = "DQ4_WINDOWNAME_SYMBOLS=$PWD/work/wc/wn.sym uv run --locked python sfc/dq4/tools/dq4menupatch.py build --rom work/ch1/overture.sfc --messages work/ch1/messages.json --out work/wc/menu.sfc && uv run --locked python sfc/dq4/tools/dq4windowcheck.py --rom work/wc/menu.sfc --symbols work/wc/wn.sym --ship work/state/ship.mss --party <일행셋.mss> --shop <이무르 방어구점 앞.mss> --out work/wc/out"
needs = ["rom", "MESENCE", "ASAR", "DQ4_GALMURI"]

[[check]]
name = "dq4-openbus-probe"
why = "뱅크 40 이상 코드가 BRK 로 DB 를 바꿔 WRAM 대신 열린 버스·롬 거울을 읽으면 에뮬레이터·카트마다 다르게 돈다(snes9x 서장 멈춤, #904). MesenCE 1장 걷기 전체 통과도 본다"
paths = [
  "sfc/dq4/tools/dq4*event.py",
  "sfc/dq4/tools/dq4prologue.py",
  "sfc/dq4/tools/dq4chapter*.py",
  "sfc/dq4/tools/dq4josa.py",
  "sfc/dq4/tools/dq4msgnames.py",
  "sfc/dq4/tools/dq4battlemsg.py",
  "sfc/dq4/tools/dq4bg3slot.py",
  "sfc/dq4/tools/dq4windowname.py",
  "sfc/dq4/tools/dq4soundpatch.py",
  "sfc/dq4/tools/dq4groupbuild.py",
  "sfc/dq4/tools/dq4door.py",
  "sfc/dq4/tools/dq4balance.py",
  "sfc/dq4/tools/dq4menumsg.py",
  "sfc/dq4/tools/dq4environmentrom.py",
  "sfc/dq4/tools/*.asm",
  "sfc/dq4/tools/dq4brkscan.py",
  "sfc/dq4/tools/dq4compatcheck.py",
  "sfc/dq4/tools/lua/dq4openbus.lua",
  "sfc/dq4/tools/dq4ch1walkcheck.py",
  "sfc/dq4/tools/dq4prologuecheck.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4compatcheck.py probe --rom work/ch1/dq4-ch1-full.sfc --out work/compat-probe"
needs = ["rom", "MESENCE", "LIBDIR"]

[[check]]
name = "dq4-compat-walk"
why = "MesenCE 에서만 우연히 도는 코드를 잡는다: libretro bsnes·snes9x 에서 서장부터 1장 끝 리셋까지 이어 걷기(#904 의 snes9x 멈춤)"
paths = [
  "sfc/dq4/tools/dq4*event.py",
  "sfc/dq4/tools/dq4prologue.py",
  "sfc/dq4/tools/dq4chapter*.py",
  "sfc/dq4/tools/dq4soundpatch.py",
  "sfc/dq4/tools/dq4groupbuild.py",
  "sfc/dq4/tools/*.asm",
  "sfc/dq4/tools/dq4compatcheck.py",
  "sfc/dq4/tools/dq4libretro.py",
  "sfc/dq4/tools/dq4cores.py",
  "sfc/dq4/tools/dq4ch1walkcheck.py",
  "sfc/dq4/tools/dq4prologuecheck.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4cores.py && uv run --locked python sfc/dq4/tools/dq4compatcheck.py walk --rom work/ch1/dq4-ch1-full.sfc --out work/compat-walk"
needs = ["rom", "dq4cores.py 로 빌드한 코어(또는 LIBRETRO_BSNES·LIBRETRO_SNES9X)"]

[[check]]
name = "dq4-heroblock"
why = "주인공이 선 칸 때문에 사건이 멈추거나(서장 저녁 의자 칸·탑 병사 왼쪽) 주인공 걸음이 엇나가는(저녁 왼쪽, 왕의 귀환 위쪽 방) 일, 1C·이벤트 걸음으로 인물이 주인공·동료와 겹쳐 보이는 일(저녁 의자 칸·신시아 오른쪽·탑 병사 왼쪽·왕의 귀환 옆 칸)이 다시 생기지 않게"
paths = [
    "sfc/dq4/tools/dq4prologue.py",
    "sfc/dq4/tools/dq4ch1event.py",
    "sfc/dq4/tools/dq4ch2event.py",
    "sfc/dq4/tools/dq4chapter1.py",
    "sfc/dq4/tools/dq4heroblockcheck.py",
    "sfc/dq4/tools/lua/dq4heroblock.lua",
    "sfc/dq4/tools/lua/dq4walkstate.lua",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && uv run --locked python sfc/dq4/tools/dq4heroblockcheck.py --rom work/ch1/dq4-ch1-full.sfc --out work/heroblock --jobs 6"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI"]

[[check]]
name = "dq4-savefixture"
why = "저장 기록으로 시작하는 장면 검사의 출발점: 고친 칸(금화·주인공·동료·flag·자리·밤)이 이어 하기로 그대로 불러와지고, 체크섬이 틀린 칸은 지워지고, 같은 입력이 같은 WRAM 을 내고, 이어 한 뒤 순간이동이 되는지(bsnes·snes9x). 재개 자리 표·칸 표·이어 하기 훅을 바꾸면 깨진다"
paths = [
  "sfc/dq4/tools/dq4savefixture.py",
  "sfc/dq4/tools/dq4chapter1.py",
  "sfc/dq4/tools/dq4chapterbox.py",
  "sfc/dq4/tools/dq4wellswitch.py",
  "sfc/dq4/tools/dq4fieldtravel.py",
  "sfc/dq4/tools/dq4groupbuild.py",
  "sfc/dq4/tools/dq4compatcheck.py",
  "sfc/dq4/tools/dq4libretro.py",
  "sfc/dq4/tools/dq4cores.py",
  "sfc/dq4/tools/dq4ch1walkcheck.py",
  "sfc/dq4/tools/dq4prologuecheck.py",
  "sfc/dq5/tools/dq5sram.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && uv run --locked python sfc/dq4/tools/dq4cores.py && uv run --locked python sfc/dq4/tools/dq4savefixture.py check --rom work/ch1/dq4-ch1-full.sfc --out work/savefixture"
needs = ["rom", "ASAR", "DQ4_GALMURI", "dq4cores.py 로 빌드한 코어(또는 LIBRETRO_BSNES·LIBRETRO_SNES9X), 밑판 캐시 DQ4_STATES_CACHE(없으면 원래 체크아웃 work/cache/states)"]

[[check]]
name = "dq4-rom-ledger"
why = "빌드 단계끼리 앞 단계가 쓴 바이트를 몰래 다시 쓰거나, 원래 DQ5 코드·자료를 허용 목록에 없이 크게 덮거나, 뱅크 경계를 넘는 쓰기·코드, 가게·여관·출구·메시지·인물 표·벡터·체크섬·훅 대상이 깨지는 일을 에뮬레이터 없이 롬 바이트로 잡는다. 곡·인물 단계가 빠진 장부(자원 저장소 없는 빌드)는 실패"
paths = [
  "sfc/dq4/tools/**",
  "sfc/dq4/ledger-allow.toml",
  "sfc/dq5/tools/*.py",
  "fc/dq4/tools/*.py",
  "uv.lock",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && uv run --locked python sfc/dq4/tools/dq4romledgercheck.py --ledger work/ch1/ledger.json --report work/ledgercheck/report.json"
needs = ["rom", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS"]

[[check]]
name = "dq4-field-obj-math"
why = "필드에서 장 주인공(OBJ 팔레트 5~7)이 BG 와 반씩 섞여 반투명하게 보이는 일: DQ5 필드 맵 불러오기(2B:82E5)의 OBJ 반 더하기($2131 = 50)를 dq4people.hook_patch 가 끈다"
paths = [
  "sfc/dq4/tools/dq4people.py",
  "sfc/dq4/tools/dq4fieldmathcheck.py",
  "sfc/dq4/tools/lua/dq4fieldmath.lua",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && uv run --locked python sfc/dq4/tools/dq4fieldmathcheck.py --rom work/ch1/dq4-ch1-full.sfc --out work/fieldmath"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS"]
