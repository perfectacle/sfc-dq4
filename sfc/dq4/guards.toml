[[check]]
name = "dq4-crit-conditions"
why = "일행 たたかう 의 회심 판정(20:C697~C6C4) 앞 조건 셋의 갈래를 1장 롬 들판 전투에서 잰다. 판정 난수를 늘 회심(20:C6B3 = 01)·회심 없음(20:C6B9 = FF)으로 고정한 사본에서, 조건이 모두 꺼지면 난수대로, $100E bit7 이면 늘 회심 아님, 주인공 전투 칸 +7 bit6(필드 41 상태 1A, 치는 쪽 칸을 읽음)이나 가진 물건 일곱 칸이 26:8D33 과 같으면(26:8D0A) 늘 회심이어야 한다. 첫 판정은 주인공($10F5 = 00)의 공격이어야 하고, 같은 전투를 두 번 돌린 판정 기록이 같아야 한다. 이어 dq4sfxscene --critical-negative 로 battle-critical 에 $100E bit7, 칸 0·1 의 +7 bit6 을 하나씩 더 묶으면 그 까닭을 대며 실패해야 한다. 판정 코드 바이트가 바뀌거나 조건의 뜻이 바뀌면 깨진다. dq4sfxscene 의 critical_blockers 가 battle-critical 에서 이 셋(일행 전투 칸 여덟의 +7 포함)을 확인하는 근거다"
