[[check]]
name = "dq4-kind14-copy"
why = "DQ5 움직이는 타일 종류 14 의 사본(롬의 자리 표 03:D9A0·타일 수 표 03:D965 로 읽은 7E:3D14~3E73, 맵에 들어갈 때 뱅크 03 이 채움)을 채우는 실내 맵 열(dq4kind14check.MAPS)에서 명령 창을 열 때, 뱅크 03 이 사본 프레임에 사본 길이만큼 쓰고, 다른 코드는 CPU 로 그 자리를 쓰지 않고, 사본 프레임부터는 WRAM 포트($2180)나 쓰기 콜백에 걸리지 않는 길로도 바뀌지 않아야 하며, 롬 표의 범위가 dq4kind14check.COPY 와 같아야 하고, dq4bg3slotcheck 의 판정(요청한 맵에 도착·자리·보임·타일맵이 버퍼와 같음)이 맞고, 같은 명령을 두 번 돌린 두 실행이 모두 끝 표지를 갖고 이를 지키며 기록이 같아야 한다. 창 글자 변수나 그림 버퍼를 사본 자리에 두면 깨진다"
