[[check]]
name = "dq4-map-people-rom-tests"
why = "롬이 있어야 도는 단위 테스트 24개: 들어설 때 숨는 FC 인물(엔도르 투기장 관중석 등)을 옮기지 않고 그 맵을 이벤트가 찾지 않으며, 누운 인물마다 발치·머리맡 옆에 말을 걸 빈 칸이 있고 발치 훅이 FC 발치 칸만 더하고 1장 빌드도 그 훅을 얹으며, 가게 장면의 카운터 앞 칸이 FC 에서 걸어서 닿고 카운터 너머가 그 가게 주인이어야 한다. 발치 훅은 05:84FE 를 부르는 곳이 C 만 보고 05:8503 이 $00·$01·스택을 지킨다는 원래 롬 바이트에 기대며, 훅 자리는 원래 롬 빈 자리 안이고 05:FF00 가게 도우미 앞이어야 한다. 롬이 없어 건너뛰거나 테스트가 빠지면 ok 수가 모자라 실패한다"
