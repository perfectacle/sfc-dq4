         "sfc/dq4/tools/dq4shopscene.py", "sfc/dq4/tools/test_dq4shopscene.py", "sfc/dq4/tools/dq4groupbuild.py",
         "sfc/dq4/tools/dq4sleepertalk.py", "sfc/dq4/tools/test_dq4sleepertalk.py",
