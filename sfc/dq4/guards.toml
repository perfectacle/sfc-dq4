needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS"]

[[check]]
name = "dq4-msg-count"
why = "메시지마다 눌러야 하는 A(▼ 대기와 저절로 넘어가지 않는 닫기 대기의 수)가 그 메시지의 쪽 수(쪽 나눔 1002 의 수 + 1, 글 없는 대기 메시지는 1)를 넘지 않아야 한다. 서장 걷기 길과 1장 걷기 검사의 왕 구간(칭찬·레벨업 줄·작별)을 걷는다. 출발 상태는 같은 명령 안의 1장 걷기(--units). 메시지 끝 코드나 레벨업 줄 잇기가 같은 쪽에서 A 를 두 번 받게 바뀌면 깨진다"
groups = ["ch1-build", "ch1-walk"]
paths = [
  "sfc/dq4/tools/dq4msgcountcheck.py",
  "sfc/dq4/tools/lua/dq4msgcount.lua",
  "tools/mesence_settings.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && rm -rf work/msgcount-walk work/fresh-msgcount && uv run --locked python sfc/dq4/tools/dq4ch1walkcheck.py --rom work/ch1/dq4-ch1.sfc --out work/msgcount-walk --units && uv run --locked python sfc/dq4/tools/dq4msgcountcheck.py --rom work/ch1/dq4-ch1.sfc --messages work/ch1/messages.json --states work/msgcount-walk --out work/fresh-msgcount"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "출발 상태는 검사 롬으로 만듦(서장 끝 상태 캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]

[[check]]
name = "dq4-people-sets"
why = "인물 그림을 얹은 1장 출하 롬(dq4-ch1-full)에서 서장·1장 맵 22개를 낮(일행 하나)·밤·호이민 세 장면으로 워프해, 슬롯마다 롬의 인물 훅이 고른 세트의 타일이 VRAM 에, 칸 목록이 레코드대로, 칸 팔레트 비트가 세트 팔레트대로 실려야 한다(66장면). 출발 상태는 같은 명령 안의 1장 걷기(--units). 인물 훅·세트 표·맵 그룹 팔레트가 어긋나면 깨진다. 훅이 없는 dq4-ch1.sfc(인물 단계 전)로 돌리면 훅 흉내가 멈춘다"
groups = ["ch1-build", "ch1-walk"]
paths = [
  "sfc/dq4/tools/dq4peoplecheck.py",
  "sfc/dq4/tools/lua/dq4peopledump.lua",
  "tools/mesence_settings.py",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && rm -rf work/people-walk work/fresh-people && uv run --locked python sfc/dq4/tools/dq4ch1walkcheck.py --rom work/ch1/dq4-ch1-full.sfc --out work/people-walk --units && uv run --locked python sfc/dq4/tools/dq4peoplecheck.py --rom work/ch1/dq4-ch1-full.sfc --states work/people-walk --out work/fresh-people"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "출발 상태는 검사 롬으로 만듦(서장 끝 상태 캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]

[[check]]
name = "dq4-name-entry"
why = "이름 입력 화면에서 실제 A·B·Y 입력으로 자모 조합·삭제·Y 완료가 모델과 같고, 완료한 이름이 새 게임 기록에 직렬화되며 메뉴 표시가 풀리고, 이름 칸 VRAM 이 기대와 같아야 한다(사례 15개, 커서 자리만 WRAM 에 둠). 조합 오토마타·완료 처리·이름 칸 그리기가 바뀌면 깨진다"
groups = ["ch1-build"]
paths = [
  "sfc/dq4/tools/dq4nameentrycheck.py",
  "tools/mesence_settings.py",
  "sfc/dq4/tools/dq4mesen.py",
  "sfc/dq4/tools/lua/dq4nameentrycheck.lua",
  "sfc/dq4/tools/lua/dq4openbus.lua",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && mkdir -p work/fresh-nameentry-rom && DQ4_NAMEENTRY_SYMBOLS=$PWD/work/fresh-nameentry-rom/name-entry.sym uv run --locked python sfc/dq4/tools/dq4menupatch.py build --rom work/ch1/overture.sfc --messages work/ch1/messages.json --out work/fresh-nameentry-rom/menu.sfc && rm -rf work/fresh-nameentry && uv run --locked python sfc/dq4/tools/dq4nameentrycheck.py --rom work/fresh-nameentry-rom/menu.sfc --symbols work/fresh-nameentry-rom/name-entry.sym --out work/fresh-nameentry"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS"]

