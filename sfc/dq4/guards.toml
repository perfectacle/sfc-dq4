[[check]]
name = "dq4-savefixture"
why = "저장 기록으로 시작하는 장면 검사의 출발점: 고친 칸(금화·주인공·동료·flag·자리·밤)이 이어 하기로 그대로 불러와지고, 체크섬이 틀린 칸은 지워지고, 같은 입력이 같은 WRAM 을 내고, 이어 한 뒤 순간이동이 되는지, 맵 곡 건너뛰기 비트(7E:21A5 bit6)가 켜진 기록으로 이어 해도 곧 맵 곡이 울리는지(bsnes·snes9x). 재개 자리 표·칸 표·이어 하기 훅을 바꾸면 깨진다"
