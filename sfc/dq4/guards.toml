needs = ["rom", "ASAR", "DQ4_GALMURI", "dq4cores.py 로 빌드한 코어(또는 LIBRETRO_BSNES·LIBRETRO_SNES9X), 밑판 캐시 DQ4_STATES_CACHE(없으면 원래 체크아웃 work/cache/states)"]

[[check]]
name = "dq4-rom-ledger"
why = "빌드 단계끼리 앞 단계가 쓴 바이트를 몰래 다시 쓰거나, 원래 DQ5 코드·자료를 허용 목록에 없이 크게 덮거나, 뱅크 경계를 넘는 쓰기·코드, 가게·여관·출구·메시지·인물 표·벡터·체크섬·훅 대상이 깨지는 일, 곡이 끝나기를 기다리는 자리(24:FF0F·25:FD00)에 되풀이하는 곡이 드는 일과 24:FF0F 반복 곡 가드·표가 롬 시퀀스와 어긋나는 일(dq4songwait, 교회 치료 뒤 멈춤, 1장·2장 빌드 둘 다)을 에뮬레이터 없이 롬 바이트로 잡는다. 곡·인물 단계가 빠진 장부(자원 저장소 없는 빌드)는 실패"
paths = [
  "sfc/dq4/tools/**",
  "sfc/dq4/ledger-allow.toml",
  "sfc/dq5/tools/*.py",
  "fc/dq4/tools/*.py",
  "uv.lock",
]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && uv run --locked python sfc/dq4/tools/dq4romledgercheck.py --ledger work/ch1/ledger.json --report work/ledgercheck/report.json && uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch2 --chapter2 && uv run --locked python sfc/dq4/tools/dq4romledgercheck.py --ledger work/ch2/ledger.json --report work/ledgercheck/report-ch2.json"
needs = ["rom", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS"]

