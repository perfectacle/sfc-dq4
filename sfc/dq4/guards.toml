# 롬·에뮬레이터가 있어야 도는 dq4 회귀 가드. 형식은 tools/guards.py, 규칙은 guards 스킬(GUARD-01~03)

[[check]]
name = "dq4-window-check"
why = "창 글자 깨짐·비침(#911 가게 동료 창 2프레임 깨짐 shopflip, #916·#918·#922 가게 목록·동료 창·사기 확인 shopwho)과, 넘친 목록 이름이 창보다 늦게 올라와 목록 줄이 비는 프레임·「누가」 창이 닫히며 메시지 창에 이름이 비치는 프레임(--every 로 talk02-full·shopwho·partyitems 와 battle11·party21 구간을 매 프레임 잼)이 다시 생기지 않게"
paths = ["sfc/dq4/tools/dq4windowname.asm", "sfc/dq4/tools/dq4windowname.py", "sfc/dq4/tools/dq4windowtext.py",
         "sfc/dq4/tools/dq4windowcheck.py", "sfc/dq4/tools/dq4bg3slot.py",
         "sfc/dq4/tools/dq4ch1walkcheck.py", "sfc/dq4/tools/dq4pins.py", "sfc/dq5/tools/lua/dq5warp.lua",
         "sfc/dq4/tools/dq4readset.py", "sfc/dq4/tools/lua/dq4readset.lua", "sfc/dq4/tools/dq4mesen.py", "tools/mesence_settings.py"]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && mkdir -p work/wc && DQ4_WINDOWNAME_SYMBOLS=$PWD/work/wc/wn.sym uv run --locked python sfc/dq4/tools/dq4menupatch.py build --rom work/ch1/overture.sfc --messages work/ch1/messages.json --out work/wc/menu.sfc && rm -rf work/wc/out && uv run --locked python sfc/dq4/tools/dq4windowcheck.py --rom work/ch1/dq4-ch1.sfc --symbols work/wc/wn.sym --symbols-rom work/wc/menu.sfc --out work/wc/out --jobs 4 --every"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS", "출발 상태는 검사 롬으로 만듦(서장 끝 상태 캐시 DQ4_STATES_CACHE, 없으면 원래 체크아웃 work/cache/states)"]

[[check]]
name = "dq4-readset-soundness"
why = "읽은 롬 바이트 캐시(dq4readset)가 결과에 닿는 입력을 빠뜨리지 않게: 읽은 집합 밖 바이트를 모두 뒤집어도 출력이 같고, 안 바이트 하나로 빗나가며, HDMA 표 읽기도 잡힌다. 배터리 기록(.srm)·상태 안 롬 이름·Lua emu.read 가 키를 비껴간 적이 있다"
paths = ["sfc/dq4/tools/dq4readset.py", "sfc/dq4/tools/lua/dq4readset.lua", "sfc/dq4/tools/dq4readsetcheck.py",
         "sfc/dq4/tools/dq4mesen.py", "sfc/dq4/tools/lua/dq4readsetsynth.lua", "sfc/dq4/tools/lua/dq4readseterr.lua", "sfc/dq4/tools/lua/dq4readsetcb.lua", "sfc/dq5/tools/lua/dq5msg.lua",
         "sfc/dq5/tools/lua/dq5warp.lua", "tools/lua/mkstate.lua", "tools/mesence_settings.py"]
run = "uv run --locked python sfc/dq4/tools/dq4build.py --out work/ch1 && uv run --locked python sfc/dq4/tools/dq4readsetcheck.py --rom work/ch1/dq4-ch1.sfc --out work/readsetcheck"
needs = ["rom", "MESENCE", "LIBDIR", "ASAR", "DQ4_GALMURI", "DQ4_ASSETS"]

