[[check]]
name = "dq4-battle-bigpic"
tier = "release"
why = "전투 큰 그림 길($0DF3 ≠ 0, 00:895D)에는 WqNmiEntry 를 걸지 않아 그동안 창 글자 대기열 항목이 기다린다. 공격·주문·회복·잠·레벨업 연출을 지나는 1장 전투 셋에서 큰 그림 길이 이어지는 길이와, 그 길에 넣은 항목이 나가기까지의 NMI 수가 상한(dq4bigpiccheck.LIMIT) 이하여야 하고, 넣은 항목은 넣기 전 VRAM 이 그 그림과 달랐다가 나간 뒤 같아야 하며, 같은 입력이면 기록 전체가 같아야 한다. LIMIT 는 실측 최댓값이라 여유가 없어, 대기열과 무관한 전투 경로 변화(연출·무리·입력)로도 넘을 수 있다. 넘으면 기준을 올리기 전에 어느 연출이 길어졌는지 본다. 큰 그림 요청을 잇달아 내는 연출이 늘거나 대기열 게이트가 그 길을 놓치면 깨진다"
