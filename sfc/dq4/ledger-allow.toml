# 롬 바이트 검사(sfc/dq4/tools/dq4romledgercheck.py)가 받아 주는 쓰기. 규칙은 sfc/dq4/docs/dq4-rom-ledger-format.md.
# 항목마다 at(끝 포함 "BB:AAAA~BB:AAAA" 또는 한 바이트 "BB:AAAA")과 why(왜 괜찮은지, 근거 문서·도구)를 쓴다.
# 단계 이름은 dq4build.py 가 장부에 적는 것: title overture menu chapter1 sound sparfx people. "*" 는 아무 단계.
# max(바이트)를 주면 그 항목이 받은 쓰기의 합이 그보다 크면 실패한다. 넓은 자리를 적을 때는 꼭 준다.
# [[overlap]] 의 reuse = true 는 앞 단계가 거울을 지워 비운 자리(장부 cleared)를 뒤 단계가 쓰는 것만 받는다.
# 의도한 것만 넣는다. 덮어쓰기가 왜 생겼는지 모르면 넣지 말고 원인을 찾는다.

# --- 단계끼리 겹침: 뒤 단계(later)가 앞 단계(earlier)가 쓴 바이트를 다시 씀

[[overlap]]
earlier = "*"
later = "*"
at = "00:FFDC~00:FFDF"
why = "머리 체크섬. 롬을 고친 단계마다 다시 맞춘다"

[[overlap]]
earlier = "title"
later = "overture"
at = "00:A70C"
why = "타이틀이 메뉴 곡 BRK 0F 10(00:A70C~A70E)을 NOP 으로 막고, 서곡이 그 앞 STA $2100 자리(00:A709~A70C)를 JSL $70FF20 으로 바꾼다. 남은 NOP 둘은 그대로(dq4-overture-format.md, dq4overture.MENU_CALL)"

[[overlap]]
earlier = "title"
later = "overture"
at = "30:801C~30:8021"
why = "타이틀 코드의 LDA #$10 / JSL $24FE9A 를 서곡이 JSL $70FF00 으로 바꿈(dq4-overture-format.md, dq4overture.TITLE_CALL)"

[[overlap]]
