# 인물 그림 종류 대응 표. dq4peoplematchcheck.py 가 원작 FC 인물 그림의 종류와 포팅 롬이 실제로 싣는 세트의
# 종류를 견준다. 형식과 근거는 sfc/dq4/docs/dq4-sprite-format.md 「원작 그림 종류와 포팅 그림 대조」.

# 종류 = 갈래. 사람 갈래(남자·여자·노인·아이·왕)는 갈래만 같으면 「비슷함」(실패 아님), 갈래가 다르면 어긋남.
