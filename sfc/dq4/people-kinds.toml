# 일부러 다른 그림으로 둔 인물. map 은 DQ5 맵, fc 는 원작 그림, gfx 는 인물 목록의 DQ5 그림. 이유에는 근거(문서·코드)를 쓴다.
[[allow]]
map = "45/04"
fc = "29"
gfx = "1F"
reason = "사란의 역사 학자: NDS mbw1f1 의 같은 대사 오브젝트가 学者 h033 이라 dq4npcport.NDS_LOOKS 로 학자 그림(dq4-sprite-format.md 「NDS 시트 고르기」)"

[[allow]]
map = "45/05"
fc = "16"
gfx = "38"
reason = "사막 바자의 아저씨: NDS mem1f1·mey1f1 이 砂漠のおじさん h058 이고 그 시트를 싣지 않아 おじさん h002 로 둠(dq4npcport.NDS_LOOKS, dq4-sprite-format.md)"
